name: Production RAG CI/CD

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: W8D1-production-rag
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with Ruff
        working-directory: W8D1-production-rag
        run: ruff check .

      - name: Run tests
        working-directory: W8D1-production-rag
        run: pytest

      - name: Build Docker image
        run: docker build -t production-rag-api ./W8D1-production-rag

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/production-rag-api
          docker tag production-rag-api:latest $IMAGE_NAME:latest
          docker push $IMAGE_NAME:latest
