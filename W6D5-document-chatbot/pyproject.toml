[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "w6d5-document-chatbot"
version = "1.0.0"
description = "Week 6 Document Chatbot using LangChain and Ollama"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"