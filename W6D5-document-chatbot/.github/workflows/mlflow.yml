name: LangChain CI

on:
  push:
    branches:
      - "feat/aiml-W6-MonicaK"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install langchain langchain-core langchain-ollama langchain-classic langgraph numexpr

      - name: Run tests
        run: |
          pytest -v

      - name: Install MLflow
        run: |
          pip install mlflow

      - name: Log CI result
        run: |
          python -c "import mlflow; print('MLflow version:', mlflow.__version__)"